<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Productos | Rels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./productos.css" />
        <!-- CSS de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- JS de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>   

</head>
<body>

  <header class="site-header">
    <div class="container head">
      <a class="brand" href="index.html" aria-label="Inicio Rels">
        <img src="assets/Logos/LogoBlanco3D.gif" alt="Rels" />
      </a>
      <h1 class="title">Productos</h1>
    </div>
    <!-- Botón carrito en el header -->
<button id="cartBtn" class="cart-btn cart-btn--header" aria-label="Abrir carrito">
  <!-- ícono carrito (SVG) -->
  <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
    <path d="M7 4h-2l-1 2h2l3.6 7.59-1.35 2.44A1.99 1.99 0 0 0 8 18h10v-2H9.42c-.14 0-.25-.11-.25-.25l.03-.12L10.1 14h6.45a2 2 0 0 0 1.8-1.1l3.58-6.49A1 1 0 0 0 21 5H7zm0 16a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm10 0a2 2 0 1 0 .001 4.001A2 2 0 0 0 17 20z" fill="currentColor"/>
  </svg>
  <span id="cartBadge">0</span>
</button>

  </header>

  <main class="container">
    <!-- Grid donde el JS inyecta las cards -->
    <section id="productGrid" class="grid"></section>
  </main>

    <footer class="site-footer" id="register">
    <div class="container footer-wrap">
      <div class="newsletter">
        <h3>Unite a la comunidad de Rels</h3>
        <p>y accedé a ofertas exclusivas</p>
        <form id="newsletterForm" novalidate>
          <input type="email" id="email" placeholder="Ingresar mail" required />
          <button class="send" aria-label="Enviar">➜</button>
        </form>
        <p id="formMsg" class="note"></p>
      </div>

      <div class="footer-brand">
        <img src="assets/Logos/LogoNegroRels.png" alt="Rels">
        <ul class="social">
          <li><a aria-label="Instagram" href="https://www.instagram.com/rels.ar/" target="_blank" rel="noopener">IG</a></li>
          <li><a aria-label="WhatsApp" href="https://wa.me/5491131142614" target="_blank" rel="noopener">WA</a></li>
          <li><a aria-label="TikTok" href="https://www.tiktok.com/@rels.ar" target="_blank" rel="noopener">TT</a></li>
        </ul>
      </div>
    </div>
    <div class="foot-note">© <span id="year"></span> Rels · Buenos Aires</div>
        <!-- Botón carrito -->
<button id="cartBtn" class="cart-btn" aria-label="Abrir carrito">
  🛒 <span id="cartBadge">0</span>
</button>

<!-- Panel del carrito -->
<div id="cartPanel" class="cart-panel" hidden>
  <div class="cart-head">
    <h3>Tu carrito</h3>
    <button id="cartClose" class="cart-x" aria-label="Cerrar">×</button>
  </div>

  <div id="cartItems" class="cart-items"></div>

  <div class="cart-foot">
    <div class="cart-total">
      Total: <strong id="cartTotal">$0</strong>
    </div>
    <div class="cart-actions">
      <button id="cartCheckout" class="btn-buy">Comprar</button>
      <button id="cartClear" class="btn-clear">Vaciar</button>
    </div>
  </div>
</div>
<div id="cartBackdrop" class="cart-backdrop" hidden></div>
  </footer>

  <script src="./productos.js" defer></script>
</body>
</html>
